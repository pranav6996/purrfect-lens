<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purrfect Predictor 🐾</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="bg-collage">
        <img src="{% static 'images/custom_cat_8.png' %}" alt="Cat Background 1" class="cat-bg cat-main">
        <img src="{% static 'images/custom_cat_2.jpg' %}" alt="Cat Background 2" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_3.png' %}" alt="Cat Background 3" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_4.png' %}" alt="Cat Background 4" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_5.png' %}" alt="Cat Background 5" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_6.png' %}" alt="Cat Background 6" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_7.png' %}" alt="Cat Background 7" class="cat-bg cat-floating">
        <img src="{% static 'images/custom_cat_1.png' %}" alt="Cat Background 8" class="cat-bg cat-floating">
    </div>
    <nav class="navbar">
        <div class="logo">🐱 Purrfect Predictor</div>
        <div class="nav-links">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'breed_list' %}">Encyclopedia</a>
            {% if user.is_authenticated %}
            <span>Hello, {{ user.username }}!</span>
            <a href="{% url 'logout' %}" class="btn-small">Logout</a>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}" class="btn-signup">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>Made with 💖 for Cat Lovers</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
