{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Join the Clowder! 🐈</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
